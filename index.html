try{const ids=(S.L||[]).filter(x=>x.estado=='disponible').map(x=>x.id);const Q={};

S.Q=Q}catch(e){S.Q={}}
ant.forEach(id=>{if((S.Q[id]||[]).some(r=>r.usuario_id==S.me.id))return;const sv=(S.L||[]).find(x=>x.id==id);if(!sv||sv.estado=='disponible')return;
if(sv.tomado_por==S.me.id){toast('🎉 ¡Te asignaron el servicio de '+h12(sv.hora)+'!');try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
else if(sv.tomado_nombre)toast('El servicio de '+h12(sv.hora)+' se lo asignaron a '+sv.tomado_nombre)})}
const yoQuiero=s=>(S.Q&&S.Q[s.id]||[]).some(r=>r.usuario_id==S.me.id);
function btnTomar(s){if(!modoQ()||staff())return `<button onclick="tomar('${s.id}')">✋ Lo tomo</button>`;
if(yoQuiero(s))return `<span class="t" style="background:#8e44ad;color:#fff">⏳ Ya pediste este servicio</span><button class="s" onclick="yaNoQuiero('${s.id}')">Retirar</button>`;
return `<button onclick="quiero('${s.id}')">🙋 Lo quiero</button>`}
function qBadge(s){const n=(S.Q&&S.Q[s.id]||[]).length;return n&&s.estado=='disponible'?` <span class="t" style="background:#8e44ad;color:#fff">🙋 ${n} ${n==1?'lo quiere':'lo quieren'}</span>`:''}
function quiero(id){const sv=byId(id);if(!navigator.geolocation){if(confirm('Este celular no da ubicación. ¿Pedir el servicio sin ubicación? Quedarás al final de la fila.'))quieroEnvia(id,null);return}
toast('📍 Tomando tu ubicación…');
const sinGps=e=>{const m=e&&e.code==1?'Diste "No permitir" a la ubicación. Actívala en Ajustes del celular > Aplicaciones > Agenda Taxi (o Chrome) > Permisos > Ubicación.':'No pude tomar tu ubicación (revisa que el GPS esté prendido y sal a un lugar abierto).';if(confirm(m+'\n\n¿Pedir el servicio sin ubicación? Quedarás al final de la fila.'))quieroEnvia(id,null)};
navigator.geolocation.getCurrentPosition(p=>quieroEnvia(id,p.coords),e=>{if(e&&e.code==1)return sinGps(e);toast('📍 Buscando mejor señal…');navigator.geolocation.getCurrentPosition(p=>quieroEnvia(id,p.coords),sinGps,{enableHighAccuracy:false,timeout:10000,maximumAge:60000})},{enableHighAccuracy:true,timeout:9000,maximumAge:0})}
async function quieroEnvia(id,c){const r=await rpc('lo_quiero',{p_id:id,p_lat:c?c.latitude:null,p_lng:c?c.longitude:null,p_prec:c?Math.round(c.accuracy||0):null},c?'🙋 Listo. Si eres el más cercano, el servicio es tuyo.':'🙋 Listo, pero sin ubicación quedas al final.');
if(r=='ok')try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
const yaNoQuiero=id=>rpc('ya_no_lo_quiero',{p_id:id},'Listo, ya no lo quieres');
S.ETA=S.ETA||{};S.AUTO=S.AUTO||{};
async function qEta(sid){const sv=byId(sid),R=(S.Q&&S.Q[sid])||[];if(!sv)return;const d=ptoRuta(sv.ubic,sv.ubic_maps);if(!d)return;
let nuevos=0;await Promise.all(R.filter(r=>r.lat!=null&&r.lng!=null&&!S.ETA[r.id+r.creado]).map(async r=>{S.ETA[r.id+r.creado]={min:null,km:null,cargando:1};
try{const x=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':'routes.distanceMeters,routes.duration'},body:JSON.stringify({origin:{location:{latLng:{latitude:r.lat,longitude:r.lng}}},destination:d,travelMode:'DRIVE',routingPreference:'TRAFFIC_UNAWARE',languageCode:'es-MX',regionCode:'MX'})});
const j=await x.json(),rt=j.routes&&j.routes[0];if(!x.ok||!rt)throw 0;S.ETA[r.id+r.creado]={min:Math.max(1,Math.round(parseInt(rt.duration)/60)),km:Math.round(rt.distanceMeters/100)/10};nuevos++}
catch(e){delete S.ETA[r.id+r.creado]}}));return nuevos}
function qOrden(sid){const R=((S.Q&&S.Q[sid])||[]).slice();const e=r=>S.ETA[r.id+r.creado];
return R.sort((a,b)=>{const ea=e(a)&&e(a).min!=null?e(a).min:1e9,eb=e(b)&&e(b).min!=null?e(b).min:1e9;return ea-eb||new Date(a.creado)-new Date(b.creado)})}
function qPanel(s){if(!staff()||s.estado!='disponible')return '';const R=(S.Q&&S.Q[s.id])||[];if(!R.length)return '';
qEta(s.id).then(n=>{if(n&&S.tab=='serv'&&!S.form&&!S.qrr){S.qrr=1;setTimeout(()=>{S.qrr=0;vServ()},300)}});
const O=qOrden(s.id),ahora=Date.now(),seg=+(S.g&&S.g.quiero_seg)||60,t0=new Date(R[0].creado).getTime(),falta=Math.max(0,Math.round(seg-(ahora-t0)/1000));
const fila=(r,i)=>{const e=S.ETA[r.id+r.creado],hace=Math.max(0,Math.round((ahora-new Date(r.creado))/1000)),pr=r.precision_m>500?' ⚠️ ubicación poco exacta (±'+r.precision_m+' m)':(r.precision_m?' (±'+r.precision_m+' m)':'');
const ub=r.lat==null?'📍 <b>sin ubicación</b>':(e&&e.min!=null?'⏱️ <b>'+e.min+' min</b> · '+e.km+' km':'⏱️ calculando…');
return `<div class="r" style="justify-content:space-between;flex-wrap:nowrap;margin-top:6px;gap:6px"><div>${i==0?'⭐ ':''}<b>🚕 ${esc(r.taxi||'')}</b> · ${esc(r.nombre||'')}<div class="mu">${ub}${pr} · pidió hace ${hace<60?hace+' s':Math.round(hace/60)+' min'}</div></div><button class="${i==0?'':'s'}" onclick="asignarQ('${s.id}','${r.usuario_id}')">Asignar</button></div>`};
return `<div class="c" style="margin:8px 0 0;border:2px solid #8e44ad"><b>🙋 ${R.length} ${R.length==1?'quiere':'quieren'} este servicio</b>${modoQ()?`<div class="mu">${falta>0?'Se asigna solo al más cercano en ~'+falta+' s (si alguien de la oficina tiene la app abierta).':'Se asignará al más cercano en unos segundos.'}</div>`:''}${O.map(fila).join('')}</div>`}
async function asignarQ(sid,uid,auto){const p=S.E.find(x=>x.id==uid);if(!p){if(!auto)toast('No encontré a ese compañero');return}
const {data,error}=await sb.from('servicios').update({estado:'tomado',tomado_por:p.id,tomado_nombre:p.nombre,tomado_taxi:p.taxi,tomado_en:new Date().toISOString()}).eq('id',sid).eq('estado','disponible').select('id');
if(error){if(!auto)toast('Error: '+error.message);return}

const otros=((S.Q&&S.Q[sid])||[]).map(r=>r.usuario_id).filter(x=>x!=uid);pushAsignado(sid,uid,otros);sb.from('interesados').delete().eq('servicio_id',sid).then(()=>{});
toast((auto?'🤖 Asignado al más cercano: ':'Asignado a ')+p.taxi+' · '+p.nombre);cargar()}
async function qTick(){if(!S.me||!S.me.activo||!staff()||!modoQ()||document.hidden||S.form)return;
const seg=(+S.g.quiero_seg||60)*1000;
for(const sv of (S.L||[]).filter(x=>x.estado=='disponible')){const R=(S.Q&&S.Q[sv.id])||[];if(!R.length||S.AUTO[sv.id])continue;
const t0=Math.min(...R.map(r=>new Date(r.creado).getTime()));if(Date.now()-t0<seg)continue;
S.AUTO[sv.id]=1;await qEta(sv.id);const O=qOrden(sv.id);if(!O.length)continue;
await asignarQ(sv.id,O[0].usuario_id,true)}}

async function buscar(q,quiet){
S.mis=false;
q=String(q===undefined?S.bq:q).trim();
if(q.length<2){S.bq='';S.BR=null;vServ();return}
S.bq=q;
const num=/^[\d\s+()-]+$/.test(q),t=(num?q.replace(/\D/g,''):q).replace(/[*%,()\\]/g,' ').trim(),p='*'+t+'*';
if(t.length<2){vServ();return}
let or=['ubic','destino','nota','tomado_nombre','tomado_taxi'].map(c=>c+'.ilike.'+p).join(',');
const fm=t.replace(/^t-?/i,'');if(/^\d{1,6}$/.test(fm))or+=',folio.eq.'+(+fm);
if(staff()){const r=await sb.from('servicio_cliente').select('servicio_id').or('nombre.ilike.'+p+',celular.ilike.'+p).limit(200);const ids=(r.data||[]).map(x=>x.servicio_id);if(ids.length)or+=',id.in.('+ids.join(',')+')'}
const {data,error}=await sb.from('servicios').select('*').or(or).order('fecha',{ascending:false}).order('hora').limit(60);
if(error){toast('Error al buscar: '+error.message);return}
if(S.bq!==q)return;
S.BR=data||[];
if(staff()&&S.BR.length){const {data:C}=await sb.from('servicio_cliente').select('*').in('servicio_id',S.BR.map(x=>x.id));S.C={};(C||[]).forEach(c=>S.C[c.servicio_id]=c)}
S.CN=S.CN||{};
if(S.tab=='serv'&&!S.form)vServ()}
async function misServ(quiet){
S.bq='';S.mis=true;
const d=new Date();d.setDate(d.getDate()-7);
const {data,error}=await sb.from('servicios').select('*').eq('tomado_por',S.me.id).gte('fecha',iso(d)).not('estado','in','(terminado,cancelado)').order('fecha').order('hora').limit(150);
if(error){toast('Error: '+error.message);return}
S.BR=data||[];
if(staff()&&S.BR.length){const {data:C}=await sb.from('servicio_cliente').select('*').in('servicio_id',S.BR.map(x=>x.id));S.C={};(C||[]).forEach(c=>S.C[c.servicio_id]=c)}
if(S.tab=='serv'&&!S.form)vServ()}
