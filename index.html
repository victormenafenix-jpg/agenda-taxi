/* ---------- "Lo quiero" con GPS ---------- */
const modoQ=()=>!!(S.g&&S.g.modo_quiero);
async function cargarQ(){const ant=new Set(Object.keys(S.Q||{}).filter(k=>(S.Q[k]||[]).some(r=>r.usuario_id==(S.me&&S.me.id))));
try{const ids=(S.L||[]).filter(x=>x.estado=='disponible').map(x=>x.id);const Q={};
if(ids.length){const r=await sb.from('interesados').select('*').in('servicio_id',ids).order('creado');if(!r.error)(r.data||[]).forEach(x=>{(Q[x.servicio_id]=Q[x.servicio_id]||[]).push(x)})}
S.Q=Q}catch(e){S.Q={}}
ant.forEach(id=>{if((S.Q[id]||[]).some(r=>r.usuario_id==S.me.id))return;const sv=(S.L||[]).find(x=>x.id==id);if(!sv||sv.estado=='disponible')return;
if(sv.tomado_por==S.me.id){toast('🎉 ¡Te asignaron el servicio de '+h12(sv.hora)+'!');try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
else if(sv.tomado_nombre)toast('El servicio de '+h12(sv.hora)+' se lo asignaron a '+sv.tomado_nombre)})}
const yoQuiero=s=>(S.Q&&S.Q[s.id]||[]).some(r=>r.usuario_id==S.me.id);
const REQ={terminal:['💳','Terminal para cobrar con tarjeta','No tienes terminal registrada. Si ya tienes terminal, contacta al administrador para que te dé de alta.','cobrar con terminal'],factura:['🧾','Poder facturar','No estás dado de alta para facturar. Contacta al administrador.','poder facturar'],transferencia:['🏦','Recibir transferencias','El cliente paga con transferencia y no tienes registrados tus datos para recibirla. Contacta al administrador y dale tus datos para que te dé de alta.','recibir transferencias']};
function falta(s){if(!S.me||ofi())return [];const f=[];if(/Tarjeta/.test(s.pago||'')&&!S.me.terminal)f.push('terminal');if(s.factura&&!S.me.factura)f.push('factura');if(s.pago=='Transferencia'&&!S.me.transferencia)f.push('transferencia');return f}
async function reqInfo(f){if(typeof f=='string')f=f.split(',');const L=f.filter(k=>REQ[k]);if(!L.length)return;let cel='';try{const r=await sb.rpc('admin_contacto');cel=r.data||''}catch(e){}
const m='Hola, quiero darme de alta para '+L.map(k=>REQ[k][3]).join(' y ')+'. Soy '+(S.me.nombre||'')+(S.me.taxi?', taxi '+S.me.taxi:'')+'.';
const d=document.createElement('div');d.className='fotov';d.innerHTML=`<div class="c" style="max-width:440px;width:100%"><div style="font-size:22px;font-weight:900">🔒 No puedes tomar este servicio</div>${L.length>1?'<div style="margin:8px 0;font-weight:700">Para este servicio te falta:</div>'+L.map(k=>`<div style="font-size:18px;margin:4px 0">${REQ[k][0]} ${REQ[k][1]}</div>`).join('')+'<div class="mu" style="margin-top:6px">Contacta al administrador para que te dé de alta.</div>':`<div style="margin:10px 0;font-size:17px">${REQ[L[0]][0]} ${REQ[L[0]][2]}</div>`}
${cel?`<a class="b" style="display:block;text-align:center;margin-top:12px;font-size:18px" target="_blank" href="https://wa.me/${tel(cel)}?text=${encodeURIComponent(m)}">💬 Escribirle al administrador</a>`:''}<button class="s" style="width:100%;margin-top:8px" onclick="this.closest('.fotov').remove()">Cerrar</button></div>`;document.body.appendChild(d)}
function btnTomar(s){{const f=falta(s);if(f.length)return `<button class="s" onclick="reqInfo('${f.join(',')}')">🔒 Solo taxis con ${f.map(k=>({terminal:'terminal',factura:'factura',transferencia:'transferencia'}[k])).join(' y ')}</button>`}if(!modoQ()||ofi())return `<button onclick="tomar('${s.id}')">✋ Lo tomo</button>`;
if(yoQuiero(s))return `<span class="t" style="background:#8e44ad;color:#fff">⏳ Ya pediste este servicio</span><button class="s" onclick="yaNoQuiero('${s.id}')">Retirar</button>`;
return `<button onclick="quiero('${s.id}')">🙋 Lo quiero</button>`}
function qBadge(s){const n=(S.Q&&S.Q[s.id]||[]).length;return n&&s.estado=='disponible'?` <span class="t" style="background:#8e44ad;color:#fff">🙋 ${n} ${n==1?'lo quiere':'lo quieren'}</span>`:''}
function quiero(id){const sv=byId(id);if(!navigator.geolocation){if(confirm('Este celular no da ubicación. ¿Pedir el servicio sin ubicación? Quedarás al final de la fila.'))quieroEnvia(id,null);return}
toast('📍 Tomando tu ubicación…');
const sinGps=e=>{const m=e&&e.code==1?'Diste "No permitir" a la ubicación. Actívala en Ajustes del celular > Aplicaciones > Agenda Taxi (o Chrome) > Permisos > Ubicación.':'No pude tomar tu ubicación (revisa que el GPS esté prendido y sal a un lugar abierto).';if(confirm(m+'\n\n¿Pedir el servicio sin ubicación? Quedarás al final de la fila.'))quieroEnvia(id,null)};
navigator.geolocation.getCurrentPosition(p=>quieroEnvia(id,p.coords),e=>{if(e&&e.code==1)return sinGps(e);toast('📍 Buscando mejor señal…');navigator.geolocation.getCurrentPosition(p=>quieroEnvia(id,p.coords),sinGps,{enableHighAccuracy:false,timeout:10000,maximumAge:60000})},{enableHighAccuracy:true,timeout:9000,maximumAge:0})}
async function quieroEnvia(id,c){const r=await rpc('lo_quiero',{p_id:id,p_lat:c?c.latitude:null,p_lng:c?c.longitude:null,p_prec:c?Math.round(c.accuracy||0):null},c?'🙋 Listo. Si eres el más cercano, el servicio es tuyo.':'🙋 Listo, pero sin ubicación quedas al final.');
if(r=='ok')try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
const yaNoQuiero=id=>rpc('ya_no_lo_quiero',{p_id:id},'Listo, ya no lo quieres');
S.ETA=S.ETA||{};S.AUTO=S.AUTO||{};
async function qEta(sid){const sv=byId(sid),R=(S.Q&&S.Q[sid])||[];if(!sv)return;const d=ptoRuta(sv.ubic,sv.ubic_maps);if(!d)return;
let nuevos=0;await Promise.all(R.filter(r=>r.lat!=null&&r.lng!=null&&!S.ETA[r.id+r.creado]).map(async r=>{S.ETA[r.id+r.creado]={min:null,km:null,cargando:1};
const ab=(S.L||[]).find(x=>x.tomado_por==r.usuario_id&&x.estado=='abordo'),via=ab&&ptoRuta(ab.destino,ab.destino_maps);
try{const x=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':'routes.distanceMeters,routes.duration'},body:JSON.stringify(Object.assign({origin:{location:{latLng:{latitude:r.lat,longitude:r.lng}}},destination:d,travelMode:'DRIVE',routingPreference:'TRAFFIC_UNAWARE',languageCode:'es-MX',regionCode:'MX'},via?{intermediates:[via]}:{}))});
const j=await x.json(),rt=j.routes&&j.routes[0];if(!x.ok||!rt)throw 0;S.ETA[r.id+r.creado]={min:Math.max(1,Math.round(parseInt(rt.duration)/60)),km:Math.round(rt.distanceMeters/100)/10,via:!!via};nuevos++}
catch(e){delete S.ETA[r.id+r.creado]}}));return nuevos}
function qOrden(sid){const R=((S.Q&&S.Q[sid])||[]).slice();const e=r=>S.ETA[r.id+r.creado];
return R.sort((a,b)=>{const ea=e(a)&&e(a).min!=null?e(a).min:1e9,eb=e(b)&&e(b).min!=null?e(b).min:1e9;return ea-eb||new Date(a.creado)-new Date(b.creado)})}
function qPanel(s){if(!puedo(s)||s.estado!='disponible')return '';const R=(S.Q&&S.Q[s.id])||[];if(!R.length)return '';
qEta(s.id).then(n=>{if(n&&S.tab=='serv'&&!S.form&&!S.qrr){S.qrr=1;setTimeout(()=>{S.qrr=0;vServ()},300)}});
const O=qOrden(s.id),ahora=Date.now(),seg=+(S.g&&S.g.quiero_seg)||60,t0=new Date(R[0].creado).getTime(),falta=Math.max(0,Math.round(seg-(ahora-t0)/1000));
const fila=(r,i)=>{const e=S.ETA[r.id+r.creado],hace=Math.max(0,Math.round((ahora-new Date(r.creado))/1000)),pr=r.precision_m>500?' ⚠️ ubicación poco exacta (±'+r.precision_m+' m)':(r.precision_m?' (±'+r.precision_m+' m)':'');
const ub=r.lat==null?'📍 <b>sin ubicación</b>':(e&&e.min!=null?'⏱️ <b>'+e.min+' min</b> · '+e.km+' km'+(e.via?' · ⏭️ al dejar a su pasajero':''):'⏱️ calculando…');
return `<div class="r" style="justify-content:space-between;flex-wrap:nowrap;margin-top:6px;gap:6px"><div>${i==0?'⭐ ':''}<b>🚕 ${esc(r.taxi||'')}</b> · ${esc(r.nombre||'')}<div class="mu">${ub}${pr} · pidió hace ${hace<60?hace+' s':Math.round(hace/60)+' min'}</div></div><button class="${i==0?'':'s'}" onclick="asignarQ('${s.id}','${r.usuario_id}')">Asignar</button></div>`};
return `<div class="c" style="margin:8px 0 0;border:2px solid #8e44ad"><b>🙋 ${R.length} ${R.length==1?'quiere':'quieren'} este servicio</b>${modoQ()?`<div class="mu">${falta>0?'Se asigna solo al más cercano en ~'+falta+' s.':'Se asignará al más cercano en unos segundos.'}</div>`:''}${O.map(fila).join('')}</div>`}
async function asignarQ(sid,uid,auto){const p=S.E.find(x=>x.id==uid);if(!p){if(!auto)toast('No encontré a ese compañero');return}
const {data,error}=await sb.from('servicios').update({estado:'tomado',tomado_por:p.id,tomado_nombre:p.nombre,tomado_taxi:p.taxi,tomado_en:new Date().toISOString()}).eq('id',sid).eq('estado','disponible').select('id');

async function achica(file){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});const M=1280,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.72))}

function rango(k){const h=new Date(),d=new Date(h.getFullYear(),h.getMonth(),h.getDate());let a,b;
if(k=='sem'||k=='semp'){const w=(d.getDay()+6)%7;a=new Date(d);a.setDate(d.getDate()-w-(k=='semp'?7:0));b=new Date(a);b.setDate(a.getDate()+6)}
else{const m=h.getMonth()-(k=='mesp'?1:0);a=new Date(h.getFullYear(),m,1);b=new Date(h.getFullYear(),m+1,0)}
return [iso(a),iso(b)]}

function csvDown(nombre,filas){const e=v=>{v=v==null?'':String(v);if(/^[=@]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const t='\ufeff'+filas.map(r=>r.map(e).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove()}
async function paginas(q){let out=[];for(let i=0;;i+=1000){const {data,error}=await q().range(i,i+999);if(error){toast('Error: '+error.message);return null}out=out.concat(data||[]);if(!data||data.length<1000)break}return out}
