<style>
:root{--bg:#f6f5f0;--cd:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#f2b705;--bd:#e2e0d8;--rd:#c0392b;--bl:#1f6feb}

*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,sans-serif;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(60px + env(safe-area-inset-bottom));max-width:640px}
h1{font-size:20px;margin:6px 0}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.b{border:0;border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;background:var(--ac);color:#1d1d1b;text-decoration:none;cursor:pointer}
.s{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.mu{color:var(--mu);font-size:14px}.hr{font-size:22px;font-weight:800}
.t{font-size:12px;background:var(--bd);border-radius:6px;padding:2px 6px;margin-left:4px}

.t.ex{background:#c0392b;color:#fff}.t.pr{background:#1f6feb;color:#fff}.t.pg{background:#dbe8ff;color:#12399a}.t.pc{background:#fddcd8;color:#8c1d18}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));background:#1d1d1b;color:#fff;padding:12px;border-radius:12px;display:none;white-space:pre-line;z-index:9}

<script>
const U='https://bqcaekftrthzbkhuzqvg.supabase.co',K='sb_publishable_waYNMThDF_lD53akh2NX9w_HX_8k4TF';
const sb=supabase.createClient(U,K);
const $=i=>document.getElementById(i),esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=n=>Math.round(n*100)/100,iso=d=>d.toLocaleDateString('en-CA');
let S={ses:false,me:null,g:null,modo:'in',tab:'serv',fecha:iso(new Date()),L:[],C:{},T:[],E:[],A:[],form:null,edit:null};
const fo=s=>s.folio?'T-'+String(s.folio).padStart(4,'0'):'';
const ST_COL={disponible:'#f2b705',tomado:'#1f6feb',en_camino:'#8e44ad',llego:'#e67e22',abordo:'#27ae60',terminado:'#8a8a85',cancelado:'#c0392b'},ST_TXT={disponible:'DISPONIBLE',tomado:'TOMADO',en_camino:'EN CAMINO',llego:'LLEGÓ',abordo:'ABORDÓ',terminado:'TERMINADO',cancelado:'CANCELADO'};
const sinCub=s=>s.estado=='disponible'&&new Date(new Date(s.fecha+'T'+s.hora).getTime()+(s.expres?15*60000:0))<new Date();
const EST={tomado:['en_camino','En camino'],en_camino:['llego','Llegué'],llego:['abordo','Abordó'],abordo:['terminado','Terminado']};
const REG=['601 General de Ley Personas Morales','603 Personas Morales con Fines no Lucrativos','605 Sueldos y Salarios e Ingresos Asimilados','606 Arrendamiento','607 Enajenación o Adquisición de Bienes','608 Demás ingresos','610 Residentes en el Extranjero sin Establecimiento Permanente','611 Ingresos por Dividendos','612 Personas Físicas con Actividades Empresariales y Profesionales','614 Ingresos por Intereses','615 Ingresos por Obtención de Premios','616 Sin Obligaciones Fiscales','620 Sociedades Cooperativas de Producción','621 Incorporación Fiscal','622 Actividades Agrícolas, Ganaderas, Silvícolas y Pesqueras','623 Opcional para Grupos de Sociedades','624 Coordinados','625 Actividades Empresariales con Ingresos por Plataformas Tecnológicas','626 Régimen Simplificado de Confianza (RESICO)','628 Hidrocarburos','629 Regímenes Fiscales Preferentes y Empresas Multinacionales','630 Enajenación de Acciones en Bolsa de Valores','Otro (escríbelo en la nota)'];
const staff=()=>S.me&&S.me.rol!='taxista',byId=id=>S.L.find(x=>x.id==id);
const mail=c=>c.replace(/\D/g,'')+'@agendataxi.mx';
const GL=['No guardar','Casa','Trabajo','Hotel'],ic=n=>({Casa:'🏠',Trabajo:'💼',Hotel:'🏨'}[n]||'📌');
const nrm=c=>{const p=String(c||'').trim().startsWith('+'),d=String(c||'').replace(/\D/g,'');if(!d)return'';if(d.length==13&&d.startsWith('521'))return'52'+d.slice(3);if(!p&&d.length==10)return'52'+d;return d};
const shw=k=>k.length==12&&k.startsWith('52')?k.slice(2):'+'+k;
const tel=c=>{c=String(c||'').replace(/\D/g,'');return c.length==10?'52'+c:c};
function nomL(el){if(el.value!='__otro')return;const n=(prompt('¿Con qué nombre lo guardo? (ej. Casa de mi hermana)')||'').trim();if(!n){el.value='No guardar';return}const o=document.createElement('option');o.textContent=n;o.value=n;el.insertBefore(o,el.lastChild);el.value=n}
const opts=(a,v)=>a.map(o=>`<option${o==v?' selected':''}>${o}</option>`).join('');
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',4500)}
const h12=t=>{let [h,m]=t.split(':');h=+h;return (h%12||12)+':'+m+' '+(h>=12?'pm':'am')};
const llegada=s=>{let [h,m]=s.hora.split(':'),x=(+h)*60+(+m)-(+s.min_antes);if(x<0)x+=1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const dia=f=>{const t=new Date(f+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}).replace(',','');return t[0].toUpperCase()+t.slice(1)};
const com=s=>{const v=+s.comision_valor||0,c=s.comision_tipo=='fijo'?v:(+s.costo||0)*v/100,i=c*(+s.comision_iva||0)/100;return{c,i,t:c+i}};
function pt(l,t){const m=(l||'').match(/(?:q=|@)(-?\d+\.\d+),(-?\d+\.\d+)/);return m?m[1]+','+m[2]:t}
const ruta=s=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(pt(s.ubic_maps,s.ubic))+'&destination='+encodeURIComponent(pt(s.destino_maps,s.destino));
function msg(s,g){let t='';if(s.ubic_maps)t+=s.ubic_maps+'\n\n';
t+='Servicio '+(s.expres?'Exprés':'Programado')+' *'+dia(s.fecha)+'*\nHora de llegada\n*'+h12(llegada(s))+'*\nHora programada\n*'+h12(s.hora)+'*\n';
if(s.ubic)t+='Ubicación\n*'+s.ubic+'*\n';
if(s.destino)t+='Destino:\n*'+s.destino+'*\n'+(s.destino_maps?s.destino_maps+'\n':'');
if(s.costo)t+='Costo\n*$ '+s.costo+'*\n';
if(s.nota)t+='Nota\n*'+s.nota+'*\n';
if(s.aeropuerto)t+='✈️ *Aeropuerto: solo taxis con placas federales*\n';
if(g){const k=com(s),c=+s.costo||0;
if(fo(s))t+='\n🔖 Folio '+fo(s);
if(s.pago!='Efectivo')t+='\n💳 '+s.pago;
if(s.factura)t+='\n🧾 Requiere factura';
t+='\n💰 Cobra $'+r2(c)+' · Deposita $'+r2(k.t)+' · Le queda $'+r2(c-k.t);
if(S.g&&S.g.cuenta_deposito)t+='\n🏦 Depositar a:\n'+S.g.cuenta_deposito;
t+='\n\n¿Quién lo toma? Tómalo aquí: '+location.href.split('#')[0].split('?')[0]+'\nO responde con tu # de taxi.'}
return t.trim()}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Mensaje copiado. Pégalo en tu grupo de WhatsApp')}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}}

/* ---------- sesión ---------- */
async function iniciar(){
const qs=new URLSearchParams(location.search);if(qs.get('s'))return seg(qs.get('s'));
const {data:{session}}=await sb.auth.getSession();S.ses=!!session;
if(!session){S.me=null;render();return}
const {data:p}=await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();S.me=p;
if(p&&p.activo){
const g=await sb.from('grupos').select('*').maybeSingle();S.g=g.data;
const t=await sb.from('tarifas').select('*').order('nombre');S.T=t.data||[];
if(staff()){await cargarE();await cargarD()}
if(S.me.rol=='admin'){await cargarA();await cargarV();await cargarP()}
const sp=qs.get('serv');if(sp){const r=await sb.from('servicios').select('fecha').eq('id',sp).maybeSingle();if(r.data){S.fecha=r.data.fecha;S.hl=sp}}
await cargar()}
render()}
async function entrar(){
const cel=$('cel').value.replace(/\D/g,''),pin=$('pin').value.trim(),er=m=>$('err').textContent=m;
if(cel.length!=10)return er('Escribe tu celular de 10 dígitos');
if(!/^\d{6}$/.test(pin))return er('El PIN son 6 números');
let r;
if(S.modo=='up'){
const n=$('nom').value.trim(),cod=$('cod').value.trim();
if(!n||!cod)return er('Falta tu nombre o el código del grupo');
r=await sb.auth.signUp({email:mail(cel),password:pin,options:{data:{nombre:n,codigo:cod,cel:cel}}});
if(r.error)return er(/Database/i.test(r.error.message)?'No pudimos registrarte. Revisa el código del grupo, o pide al administrador que autorice tu celular.':'No se pudo registrar: '+r.error.message);
if(!r.data.session)r=await sb.auth.signInWithPassword({email:mail(cel),password:pin})
}else r=await sb.auth.signInWithPassword({email:mail(cel),password:pin});
if(r.error)return er('Celular o PIN incorrectos');
await iniciar()}
async function salir(){await sb.auth.signOut();S.me=null;S.ses=false;render()}
function modo(m){S.modo=m;render()}

/* ---------- datos ---------- */
async function cargar(){
const {data,error}=await sb.from('servicios').select('*').eq('fecha',S.fecha).order('hora');
if(error){toast('Error: '+error.message);return}
S.L=data||[];S.C={};
if(staff()&&S.L.length){const {data:C}=await sb.from('servicio_cliente').select('*').in('servicio_id',S.L.map(x=>x.id));(C||[]).forEach(c=>S.C[c.servicio_id]=c)}
S.CN=S.CN||{};
if(!staff()){await Promise.all(S.L.filter(x=>x.tomado_por==S.me.id&&S.CN[x.id]===undefined).map(async x=>{const r=await sb.rpc('mi_cliente',{p_id:x.id});S.CN[x.id]=r.error?'':(r.data||'')}))}
if(S.tab=='serv'&&!S.form)render()}
async function cargarE(){const {data}=await sb.from('perfiles').select('*').order('nombre');S.E=data||[]}
async function rpc(fn,a){
const {data,error}=await sb.rpc(fn,a);if(error){toast(error.message);return}
const m={ok:'Listo',ya_tomado:'Otro compañero ya lo tomó',renta_vencida:'Tu renta semanal está vencida',sin_taxi:'Te falta número de taxi. Avisa al administrador',sin_federal:'Este servicio es del aeropuerto y solo lo pueden tomar taxis con placas federales',sin_acceso:'Sin acceso',no_permitido:'No permitido'};
toast(m[data]||data);cargar();return data}
const tomar=async id=>{const r=await rpc('tomar_servicio',{p_id:id});if(r=='ok'&&confirm('¿Quieres poner una alarma en tu calendario para este servicio?'))recordar(id)},soltar=id=>rpc('soltar_servicio',{p_id:id}),estado=(id,e)=>rpc('cambiar_estado',{p_id:id,p_estado:e});
function dia_(n){const d=new Date();d.setDate(d.getDate()+n);S.fecha=iso(d);cargar()}
let bor=null;
async function borrarS(id){
if(bor!=id){bor=id;toast('Toca 🗑️ otra vez para borrar de verdad (solo pruebas). Para servicios reales usa Cancelar');setTimeout(()=>bor=null,4000);return}
await sb.from('servicios').delete().eq('id',id);bor=null;cargar()}
function cobroTransf(id){
const s=byId(id),c=S.C[id];
if(!c||!c.celular)return toast('No hay celular del cliente');
if(!s.tomado_taxi)return toast('Aún no tiene taxi asignado');
const p=S.E.find(x=>x.id==s.tomado_por)||{};
if(!p.cuenta_transferencia)return toast('Este taxista no tiene sus datos de transferencia. Agrégalos en Equipo → su perfil → Datos para transferirle');
const t='Buen día'+(c.nombre?' *'+c.nombre+'*':'')+' 🚖\nPara pagar su servicio por transferencia:\n\n'+(+s.costo>0?'💵 Monto: *$'+s.costo+'*\n\n':'')+'🏦 Datos para su transferencia:\n'+p.cuenta_transferencia+'\n\n📸 Al transferir, por favor envíenos la captura del comprobante. ¡Gracias!';
try{navigator.clipboard.writeText(t)}catch(e){}
window.open('https://wa.me/'+tel(c.celular)+'?text='+encodeURIComponent(t),'_blank')}
function llego(id,pre){
const s=byId(id),c=S.C[id];
if(!c||!c.celular)return toast('No hay celular del cliente');
if(!s.tomado_taxi)return toast('Aún no tiene taxi asignado');
const p=S.E.find(x=>x.id==s.tomado_por)||{};
const L=[(p.linea?p.linea+' ':'')+s.tomado_taxi],tx='🚕 Taxi: *'+L[0]+'*\n👤 Operador(a): *'+s.tomado_nombre+'*'+(p.carro?'\n🚘 Unidad: *'+p.carro+'*':'')+(p.placas?'\n🔢 Placas: *'+p.placas+'*':'');
const nm=c.nombre?' *'+c.nombre+'*':'';
let t;
if(pre){t='Buen día'+nm+' 🚖\n\nSu servicio'+(s.expres?'':' *programado*')+' está confirmado:\n\n📅 Día: *'+dia(s.fecha)+'*\n🕘 Hora: *'+h12(s.hora)+'*\n'+tx+(+s.costo>0?'\n💵 Costo del servicio: *$'+s.costo+'*'+(s.pago?' ('+s.pago+')':''):'')+(s.expres?'':'\n\n⏰ La unidad llegará con '+(s.min_antes||10)+' minutos de anticipación.')+(s.pago=='Transferencia'&&p.cuenta_transferencia?'\n\n🏦 Datos para su transferencia:\n'+p.cuenta_transferencia+'\n\n📸 Al transferir, por favor envíenos la captura del comprobante.':'')+(s.token?'\n\n📍 Siga su taxi en tiempo real aquí:\n'+location.href.split('#')[0].split('?')[0]+'?s='+s.token:'')+'\n\n¡Gracias por su preferencia!'}
else{t='Buen día'+nm+' 🚖\nSu taxi *'+s.tomado_taxi+'* está en espera 📍'+(s.ubic?' *'+s.ubic+'*':'')+'.\nLo atiende *'+s.tomado_nombre+'*. Cuando esté listo, puede abordar.'}
try{navigator.clipboard.writeText(t)}catch(e){}
window.open('https://wa.me/'+tel(c.celular)+'?text='+encodeURIComponent(t),'_blank');
if(!pre&&!s.avisado){sb.from('servicios').update({avisado:true}).eq('id',id).then(()=>cargar())}}

/* ---------- pantallas ---------- */
function render(){
const a=$('app');
if(!S.ses){
a.innerHTML=`<h1>🚕 Agenda Taxi</h1><div class="c"><div class="r"><button class="${S.modo=='in'?'':'s'}" onclick="modo('in')">Entrar</button><button class="${S.modo=='up'?'':'s'}" onclick="modo('up')">Registrarme</button></div>

${S.modo=='up'?'<label>Tu nombre</label><input id="nom"><label>Código del grupo</label><input id="cod" autocapitalize="characters">':''}

<p id="err" style="color:var(--rd)"></p><button onclick="entrar()" style="width:100%">${S.modo=='in'?'Entrar':'Crear cuenta'}</button></div>`;return}

const tabs=[['serv','Servicios']].concat(staff()?[['nuevo','+ Nuevo']]:[]).concat(S.me.rol=='admin'?[['eq','Equipo'],['cli','Clientes'],['res','Resumen']]:[]);
a.innerHTML=`<div class="r" style="justify-content:space-between"><b>🚕 ${esc(S.me.nombre)}</b><span class="mu">${S.me.rol}${S.me.rol=='taxista'?' · renta hasta '+(S.me.pagado_hasta||'—'):''}</span><button class="s" onclick="salir()">Salir</button></div>
<div class="r" style="margin:8px 0">${tabs.map(t=>`<button class="${S.tab==t[0]?'':'s'}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</div><div id="v"></div>`;
({serv:vServ,nuevo:vForm,eq:vEq,cli:vCli,res:vRes})[S.tab]()}
function tab(t){S.tab=t;S.edit=null;S.form=t=='nuevo'?{}:null;S.gdt=0;S.SEL=S.LO=S.LD=null;if(t=='serv')cargar();if(t=='cli'){S.CL=null;cargarCli()}if(t=='res')cargarRes();render()}
function editarS(id){S.tab='nuevo';S.form={id};render()}

function card(s){
const k=com(s),c=+s.costo||0,mine=s.tomado_por==S.me.id,cl=S.C[s.id],n=EST[s.estado],sc=sinCub(s),col=sc?'#7b1d14':(ST_COL[s.estado]||'var(--bd)'),live=s.estado!='terminado'&&s.estado!='cancelado';
let x=`<div class="c" style="border-left:8px solid ${col}${s.aeropuerto?';outline:2px solid #0f9d9a':''}${S.hl==s.id?';box-shadow:0 0 0 4px #f2b705':''}">
<div class="r" style="justify-content:space-between">${s.expres?`<span class="hr" style="color:#c0261b">⚡ EXPRÉS <span class="mu" style="font-size:13px;font-weight:600">${fo(s)} · subido ${h12(s.hora)}</span></span><span class="mu">¡Ya!</span>`:`<span class="hr" style="color:#1c4fa1">🕐 PROGRAMADO ${h12(s.hora)} <span class="mu" style="font-size:13px;font-weight:600">${fo(s)}</span></span><span class="mu">Llegar ${h12(llegada(s))}</span>`}</div>
<div>${esc(s.ubic)} → <b>${esc(s.destino)}</b></div>
${+s.km>0?`<div style="font-size:19px;font-weight:800;margin:4px 0">📏 ${s.km} km${+s.precio_sug>0?` · Mapa $${r2(+s.precio_sug)}${c>+s.precio_sug?` → Se cobra $${r2(c)} <span style="color:#0a7a3c">(+$${r2(c-s.precio_sug)})</span>`:c<+s.precio_sug?` → Se cobra $${r2(c)} <span style="color:#c0261b">(−$${r2(s.precio_sug-c)})</span>`:` · Se cobra $${r2(c)}`}`:''}</div>`:''}
<div class="mu"><b style="font-size:18px;color:var(--tx,#1d1d1b)">$${r2(c)}</b><span class="t ${s.expres?'ex':'pr'}">${s.expres?'EXPRÉS':'PROGRAMADO'}</span><span class="t" style="background:${col};color:${s.estado=='disponible'&&!sc?'#1d1d1b':'#fff'}">${sc?'SIN CUBRIR':ST_TXT[s.estado]||esc(s.estado)}</span>${s.pago!='Efectivo'?'<span class="t '+(s.pago=='Tarjeta crédito'?'pc':'pg')+'">'+esc(s.pago)+'</span>':''}${s.factura?'<span class="t">FACTURA</span>':''}${s.especial?'<span class="t">ESPECIAL</span>':''}${s.aeropuerto?'<span class="t ae">✈️ AEROPUERTO · PLACAS FEDERALES</span>':''}</div>
${s.estado=='cancelado'&&s.cancel_motivo?`<div class="mu">❌ Motivo: ${esc(s.cancel_motivo)}</div>`:''}
${s.nota?`<div class="mu">📝 ${esc(s.nota)}</div>`:''}
<div class="mu">💳 Pago: <b>${esc(s.pago)}</b>${s.factura?' · 🧾 Requiere factura':''}</div>
<div class="mu">💰 Cobra $${r2(c)} · Deposita $${r2(k.t)} · Le queda $${r2(c-k.t)}</div>
${!staff()&&mine&&S.CN&&S.CN[s.id]?`<div>👤 Cliente: <b>${esc(S.CN[s.id])}</b></div>`:''}

function avisos(){const now=new Date(),h=[];
S.L.filter(x=>x.estado=='llego'&&!x.avisado).forEach(x=>{const c=S.C[x.id];h.push(`<div class="c" style="border:2px solid #27ae60;margin:8px 0"><b>🚖 YA LLEGÓ ${esc(x.tomado_taxi||'')} · ${fo(x)}</b><div class="mu">${esc(x.tomado_nombre||'')} ${c&&c.nombre?'· cliente '+esc(c.nombre):''}</div><button style="margin-top:6px;width:100%" onclick="llego('${x.id}')">📩 Avisar al cliente que ya llegó</button></div>`)});
S.L.filter(x=>x.estado=='tomado').forEach(x=>{const sal=new Date(x.fecha+'T'+llegada(x)+':00'),m=(sal-now)/6e4;if(m<30&&m>-120)h.push(`<div class="c" style="border:2px solid #c0392b;margin:8px 0"><b>⚠️ ${esc(x.tomado_taxi||'')} · ${fo(x)} debe salir ${m>0?'en '+Math.round(m)+' min':'ya'}</b><div class="mu">${esc(x.tomado_nombre||'')} no ha marcado <b>En camino</b>.</div><button style="margin-top:6px;width:100%" onclick="recordarT('${x.id}')">🔔 Recordarle por WhatsApp</button></div>`)});
return h.join('')}
function recordarT(id){const s=byId(id),p=S.E.find(x=>x.id==s.tomado_por);if(!p||!p.cel)return toast('El compañero no tiene celular registrado');
const t='Recordatorio 🔔 '+p.nombre.split(' ')[0]+', tienes el servicio *'+fo(s)+'* a las *'+h12(s.hora)+'* (llegar '+h12(llegada(s))+').\n'+(s.ubic||'')+' → '+(s.destino||'')+'\nConfírmame si ya vas en camino.\nÁbrelo aquí: '+location.href.split('#')[0].split('?')[0]+'?serv='+s.id;
window.open('https://wa.me/'+tel(p.cel)+'?text='+encodeURIComponent(t),'_blank')}
async function seg(t){
const a=$('app'),E=['tomado','en_camino','llego','abordo','terminado'],N={tomado:'Taxi asignado',en_camino:'En camino',llego:'Su taxi ya llegó',abordo:'A bordo',terminado:'Servicio terminado'};
let ant=null;
async function ver(){const {data,error}=await sb.rpc('seguimiento',{p_token:t});
if(error||!data){a.innerHTML='<h1>🚕 Seguimiento de su taxi</h1><div class="c">No encontramos este servicio. Revise que la liga esté completa.</div>';return}
const e=data.estado,i=E.indexOf(e),B={disponible:['⏳ Estamos asignando su taxi','var(--ac)'],tomado:['✅ Su taxi fue asignado','#1f6feb'],en_camino:['🚕 Su taxi va en camino','#8e44ad'],llego:['🚖 ¡Su taxi ya llegó!','#27ae60'],abordo:['👍 Buen viaje','#27ae60'],terminado:['Servicio terminado. ¡Gracias!','#8a8a85'],cancelado:['Servicio cancelado','#c0392b']}[e]||['',''];
if(ant&&ant!=e&&e=='llego'){try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(x){}document.title='🚖 ¡Su taxi ya llegó!'}
ant=e;
a.innerHTML=`<h1>🚕 Seguimiento de su taxi</h1><div class="c" style="background:${B[1]};color:${e=='disponible'?'#1d1d1b':'#fff'};text-align:center;font-size:22px;font-weight:800;padding:18px">${B[0]}</div>
<div class="c"><div class="mu">Folio ${data.folio?'T-'+String(data.folio).padStart(4,'0'):''} · ${dia(data.fecha)} · ${h12(data.hora)}</div>${data.ubic?`<div>📍 ${esc(data.ubic)}</div>`:''}${data.destino?`<div>🏁 ${esc(data.destino)}</div>`:''}
${data.taxi?`<hr style="border:0;border-top:1px solid var(--bd)"><div>🚕 Taxi: <b>${esc((data.linea?data.linea+' ':'')+data.taxi)}</b></div><div>👤 Operador(a): <b>${esc(data.operador||'')}</b></div>${data.carro?`<div>🚘 <b>${esc(data.carro)}</b></div>`:''}${data.placas?`<div>🔢 Placas: <b>${esc(data.placas)}</b></div>`:''}`:''}</div>
${e!='cancelado'&&e!='disponible'?`<div class="c">${E.map((x,j)=>`<div style="padding:4px 0;${j==i?'font-weight:800':'color:var(--mu)'}">${j<i?'✅':j==i?'➡️':'⚪'} ${N[x]}</div>`).join('')}</div>`:''}
<p class="mu">Esta pantalla se actualiza sola. No necesita iniciar sesión.</p>`}
await ver();setInterval(()=>{if(!document.hidden)ver()},8000)}
setInterval(()=>{if(S.me&&S.me.activo&&S.tab=='serv'&&!S.form&&!document.hidden&&!new URLSearchParams(location.search).get('s'))cargar()},20000);
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script></body></html>
