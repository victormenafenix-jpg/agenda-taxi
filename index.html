<script>
/* ==========================================================================
   MÓDULO DE AUDIO & ALERTAS SENSORIALES (COMPLETAMENTE GRATUITO)
   ========================================================================== */
window.AUDIO_SISTEMA = {
    alarmaObjeto: null,
    
    // 🔊 1. ALERTA DE NUEVO VIAJE DISPONIBLE (Sonido Continuo en Bucle)
    activarAlarmaContinua: function() {
        if (!this.alarmaObjeto) {
            this.alarmaObjeto = new Audio("https://google.com");
            this.alarmaObjeto.loop = true;
        }
        this.alarmaObjeto.play().catch(function(err){
            console.log("Audio bloqueado temporalmente por el navegador hasta interacción:", err);
        });
        
        // Activar la vibración intermitente en celulares Android habilitados
        if (navigator.vibrate) {
            navigator.vibrate([500, 300, 500, 300, 500]);
        }
    },
    
    // 📴 Apaga de golpe la alerta cuando el taxista/repartidor interactúa
    desactivarAlarmaContinua: function() {
        if (this.alarmaObjeto) {
            this.alarmaObjeto.pause();
            this.alarmaObjeto.currentTime = 0;
        }
        if (navigator.vibrate) {
            navigator.vibrate(0);
        }
    },
    
    // 🎵 2. SONIDO DE VALIDACIÓN / ABORDAJE (Campana Corta de Éxito)
    reproducirSonidoExito: function() {
        var sonidoCorto = new Audio("https://google.com");
        sonidoCorto.play().catch(function(e){ console.log(e); });
        
        if (navigator.vibrate) {
            navigator.vibrate(150);
        }
    }
};
