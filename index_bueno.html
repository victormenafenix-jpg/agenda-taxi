let nl=0,nt=0;const mapa={};(E.tour.lugares||[]).forEach(l=>{let m=c.lugares.find(x=>x.id==l.id||nn(x.nombre)==nn(l.nombre));if(!m){m=JSON.parse(JSON.stringify(l));if(c.lugares.some(x=>x.id==m.id))m.id='l'+Date.now().toString(36)+nl;c.lugares.push(m);nl++}else if(m.lat==null&&l.lat!=null){m.lat=l.lat;m.lng=l.lng}mapa[l.id]=m.id});

/* ----- 🗺️ distritos / secciones en el mapa del evento ----- */
const CPCOL=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#9a6324','#469990','#800000','#808000','#000075'];
function cpNombre(p,i){p=p||{};const k=Object.keys(p),g=n=>{const x=k.find(z=>z.toLowerCase()==n);return x!=null?p[x]:null};
const nm=g('nombre')||g('name')||g('nom_distrito')||g('nombre_distrito');if(nm&&!/^\d+$/.test(String(nm)))return String(nm);
const d=g('distrito')||g('distrito_l')||g('distrito_f')||g('dist'),s=g('seccion')||g('secc');if(s!=null)return 'Sección '+s;if(d!=null)return 'Distrito '+d;if(nm)return 'Zona '+nm;return 'Zona '+(i+1)}
const cpRed=c=>Array.isArray(c[0])?c.map(cpRed).filter((x,i,a)=>!Array.isArray(x)||typeof x[0]!='number'||i==0||x[0]!=a[i-1][0]||x[1]!=a[i-1][1]):[+(+c[0]).toFixed(5),+(+c[1]).toFixed(5)];
function cpLimpia(fc){const F=[];(fc.features||[]).forEach((f,i)=>{const g=f&&f.geometry;if(!g||!/Polygon/.test(g.type))return;F.push({type:'Feature',properties:{nombre:(f.properties&&f.properties.nombre&&f.properties._ok)?f.properties.nombre:cpNombre(f.properties,i),color:CPCOL[F.length%CPCOL.length],_ok:1},geometry:{type:g.type,coordinates:cpRed(g.coordinates)}})});return {type:'FeatureCollection',features:F}}
function cpKml(txt){const x=new DOMParser().parseFromString(txt,'text/xml'),F=[];const co=s=>String(s||'').trim().split(/\s+/).map(p=>p.split(',').map(Number)).filter(p=>p.length>=2&&!isNaN(p[0]));
x.querySelectorAll('Placemark').forEach(pm=>{const P=[...pm.querySelectorAll('Polygon')].map(pg=>{const o=pg.querySelector('outerBoundaryIs coordinates'),I=[...pg.querySelectorAll('innerBoundaryIs coordinates')];return [co(o&&o.textContent),...I.map(n=>co(n.textContent))]}).filter(r=>r[0].length>2);if(!P.length)return;
const pr={};pm.querySelectorAll('ExtendedData Data, ExtendedData SimpleData').forEach(d=>{pr[d.getAttribute('name')]=(d.querySelector('value')||d).textContent});const n=pm.querySelector('name');if(n)pr.name=n.textContent;
F.push({type:'Feature',properties:pr,geometry:P.length==1?{type:'Polygon',coordinates:P[0]}:{type:'MultiPolygon',coordinates:P}})});return {type:'FeatureCollection',features:F}}
const cpLib=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('No cargó el lector de mapas'));document.head.appendChild(s)});
async function cpLeer(f){const n=f.name.toLowerCase();
if(/\.(geo)?json$/.test(n))return JSON.parse(await f.text());
if(/\.kml$/.test(n))return cpKml(await f.text());
if(/\.kmz$/.test(n)){if(!window.JSZip)await cpLib('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');const z=await JSZip.loadAsync(f),k=Object.keys(z.files).find(x=>/\.kml$/i.test(x));if(!k)throw new Error('El KMZ no trae mapa');return cpKml(await z.files[k].async('string'))}
if(/\.zip$/.test(n)){if(!window.shp)await cpLib('https://unpkg.com/shpjs@4.0.4/dist/shp.min.js');let r=await shp(await f.arrayBuffer());if(Array.isArray(r))r={type:'FeatureCollection',features:r.flatMap(x=>x.features||[])};return r}
throw new Error('Sube un archivo .kml, .kmz, .geojson o un .zip de Shapefile')}
async function cpCargar(){try{const r=await sb.rpc('ev_capas',{p_tok:S.EV.tok});S.EVC=r.data&&r.data.features?r.data:null}catch(e){S.EVC=null}cpPintar()}
function cpPintar(){if(!EVM.map)return;const D=EVM.map.data;D.forEach(f=>D.remove(f));(EVM.cpl||[]).forEach(m=>m.map=null);EVM.cpl=[];if(!S.EVC||S.evCpOff)return;
D.addGeoJson(S.EVC);D.setStyle(f=>({fillColor:f.getProperty('color')||'#7d3cb5',fillOpacity:.13,strokeColor:f.getProperty('color')||'#7d3cb5',strokeWeight:2,clickable:true,zIndex:0}));
if(!EVM.cpL){EVM.cpL=1;D.addListener('click',e=>{if(S.EV.pick){evPick({lat:e.latLng.lat(),lng:e.latLng.lng()});return}toast('🗺️ '+e.feature.getProperty('nombre'))})}
if(S.EVC.features.length<=60&&EVM.lib)S.EVC.features.forEach(f=>{const c=cpCentro(f.geometry);if(!c)return;const d=document.createElement('div');d.innerHTML=`<div style="font-size:12px;font-weight:800;color:${f.properties.color};text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap">${esc(f.properties.nombre)}</div>`;EVM.cpl.push(new EVM.lib.AdvancedMarkerElement({map:EVM.map,position:c,content:d,zIndex:0}))})}
function cpAnillos(g){return g.type=='Polygon'?[g.coordinates[0]]:g.type=='MultiPolygon'?g.coordinates.map(p=>p[0]):[]}
function cpCentro(g){const R=cpAnillos(g).sort((a,b)=>b.length-a.length)[0];if(!R||!R.length)return null;let x=0,y=0;R.forEach(p=>{x+=p[0];y+=p[1]});return {lat:y/R.length,lng:x/R.length}}
function cpDentro(la,ln){if(!S.EVC)return null;const f=S.EVC.features.find(f=>cpAnillos(f.geometry).some(R=>dentroZona({lat:la,lng:ln},R.map(p=>[p[1],p[0]]))));return f?f.properties.nombre:null}
function cpPanel(){const F=(S.EVC&&S.EVC.features)||[];
evFormH(`<b>🗺️ Distritos o secciones en el mapa</b>${ay('Sube el mapa de distritos o secciones (el INE y otras páginas lo dan en KML, KMZ o Shapefile .zip) o dibuja cada zona a mano. Lo ven la central y los coordinadores en su mapa, y cada coordinador aparece con el distrito donde está su punto.')}

${F.length?`<div style="margin-top:8px;font-weight:700">${F.length} zona(s)</div><div style="max-height:220px;overflow:auto">${F.map((f,i)=>`<div class="r" style="justify-content:space-between;align-items:center;flex-wrap:nowrap;margin:3px 0"><span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${f.properties.color}"></span> ${esc(f.properties.nombre)}</span><span><button class="s" style="padding:3px 8px" onclick="cpRen(${i})">✏️</button><button class="s" style="padding:3px 8px" onclick="cpQuitar(${i})">🗑️</button></span></div>`).join('')}</div>
<div class="r" style="margin-top:6px"><button class="s" onclick="S.evCpOff=!S.evCpOff;cpPintar()">👁️ Mostrar / ocultar</button><button class="s" onclick="if(confirm('¿Borrar todas las zonas?'))cpGuardar(null)">🗑️ Borrar todo</button></div>`:'<div class="mu" style="margin-top:8px">Todavía no hay zonas.</div>'}
<button class="s" style="width:100%;margin-top:8px" onclick="evCerrarF()">Cerrar</button>`)}
async function cpSubir(inp){const f=inp.files&&inp.files[0];if(!f)return;toast('📂 Leyendo el mapa…');
try{const fc=cpLimpia(await cpLeer(f));if(!fc.features.length)throw new Error('El archivo no trae zonas (polígonos)');
if(fc.features.length>400&&!confirm('El mapa trae '+fc.features.length+' zonas. Es mucho y se puede poner lento. ¿Subirlo así?'))return;
const old=(S.EVC&&S.EVC.features)||[];const keep=old.length&&confirm('¿Agregar estas zonas a las que ya tienes?\n\nAceptar = agregar · Cancelar = reemplazar');
await cpGuardar({type:'FeatureCollection',features:(keep?old:[]).concat(fc.features)});if(EVM.map&&fc.features.length){const b=new google.maps.LatLngBounds();fc.features.forEach(x=>cpAnillos(x.geometry).forEach(R=>R.forEach(p=>b.extend({lat:p[1],lng:p[0]}))));EVM.map.fitBounds(b,30)}}
catch(e){toast('No pude leer el mapa: '+String(e.message||e).slice(0,90))}}
async function cpGuardar(fc){const r=await sb.rpc('ev_capas_guardar',{p_tok:S.EV.tok,p:fc});if(r.error||!r.data||!r.data.ok)return toast((r.data&&r.data.msg)||'No se pudo guardar: '+(r.error&&/function|does not exist/i.test(r.error.message)?'falta correr el paso 37':(r.error&&r.error.message||'')));
S.EVC=fc;cpPintar();evInfo();cpPanel();toast('✅ Mapa guardado')}
function cpRen(i){const f=S.EVC.features[i],n=prompt('Nombre de la zona',f.properties.nombre);if(!n)return;f.properties.nombre=n.trim().slice(0,60);cpGuardar(S.EVC)}
function cpQuitar(i){if(!confirm('¿Quitar '+S.EVC.features[i].properties.nombre+'?'))return;S.EVC.features.splice(i,1);cpGuardar(S.EVC.features.length?S.EVC:null)}
function cpDibujar(){if(!EVM.map)return;const c=EVM.map.getCenter(),la=c.lat(),ln=c.lng(),r=.012;if(EVM.cpd)EVM.cpd.setMap(null);
EVM.cpd=new google.maps.Polygon({map:EVM.map,paths:[{lat:la+r,lng:ln-r},{lat:la+r,lng:ln+r},{lat:la-r,lng:ln+r},{lat:la-r,lng:ln-r}],editable:true,strokeColor:'#111',strokeWeight:3,fillColor:'#f2b705',fillOpacity:.25,zIndex:5});
EVM.cpd.addListener('rightclick',e=>{if(e.vertex!=null&&EVM.cpd.getPath().getLength()>3)EVM.cpd.getPath().removeAt(e.vertex)});
evFormH(`<b>✏️ Dibuja la zona</b><div class="mu" style="margin:4px 0">Mueve el mapa a la zona, arrastra los <b>puntos blancos</b> de la figura amarilla hasta la orilla. Para poner otro punto, arrastra el puntito de la mitad de una línea. Clic derecho quita un punto.</div>

<div class="r" style="margin-top:8px"><button style="flex:1" onclick="cpDibG()">💾 Guardar zona</button><button class="s" onclick="EVM.cpd.setMap(null);EVM.cpd=null;cpPanel()">Cancelar</button></div>`)}
async function cpDibG(){const n=$('cpd_n').value.trim();if(!n)return toast('Ponle nombre a la zona');const R=EVM.cpd.getPath().getArray().map(p=>[+p.lng().toFixed(5),+p.lat().toFixed(5)]);R.push(R[0]);EVM.cpd.setMap(null);EVM.cpd=null;
const F=((S.EVC&&S.EVC.features)||[]).slice();F.push({type:'Feature',properties:{nombre:n.slice(0,60),color:CPCOL[F.length%CPCOL.length],_ok:1},geometry:{type:'Polygon',coordinates:[R]}});await cpGuardar({type:'FeatureCollection',features:F})}

function vEvt(){const L=S.EVT;if(!L){$('v').innerHTML='<p class="mu">Cargando…</p>';return}
if(L.err){$('v').innerHTML='<div class="c">No se pudo cargar: '+esc(/function|does not exist/i.test(L.err)?'falta correr el paso 36':L.err)+'</div>';return}
$('v').innerHTML=`<div class="c"><b>📣 Nuevo evento</b>${ay('Para eventos grandes (partidos, campañas, bodas…). La oficina recibe su liga de CENTRAL: ahí da de alta a sus coordinadores por colonia o distrito y ve todas las unidades en el mapa. Cada coordinador pide taxis a su punto con su propia liga. La oficina paga por adelantado y cada servicio se descuenta del crédito.')}
<div class="r" style="margin-top:6px;flex-wrap:nowrap"><input id="evn" placeholder="Ej. Partido MC · Campaña 2027" style="flex:1;width:auto"><button onclick="evtNuevo()">➕ Crear</button></div></div>${L.map(evtCard).join('')||'<p class="mu">Todavía no hay eventos.</p>'}`}
function evtCard(e){const s=e.saldo||{},q=(+s.pagado||0)-(+s.gastado||0),lig=evLiga(e.tok);
return `<div class="c" style="border-left:8px solid ${e.activo?'#0d2c54':'#999'}"><div class="r" style="justify-content:space-between;align-items:center"><b style="font-size:18px">📣 ${esc(e.nombre)}</b>${e.activo?'':'<span class="t">CERRADO</span>'}</div>
<div class="mu">💰 Pagado $${r2(+s.pagado||0)} · Usado $${r2(+s.gastado||0)} · <b style="color:${q<=.2*(+s.pagado||0)?'#c0392b':'#27ae60'}">Queda $${r2(q)}</b> · 🚕 ${e.servicios} servicio(s) · 👥 ${e.personas} personas</div>
<label>🏢 Liga de la central (para la oficina)</label><input readonly value="${esc(lig)}" onclick="this.select()">
<div class="r" style="margin-top:6px"><a class="b" target="_blank" href="${esc(lig)}">🖥️ Abrir tablero</a><a class="b s" target="_blank" href="${evWa('','📣 '+e.nombre+'\nEsta es la liga de la CENTRAL del evento. Ábranla en la computadora: ahí dan de alta a sus coordinadores y ven todas las unidades en el mapa.\n'+lig)}">📤 Mandar por WhatsApp</a></div>
<details class="c" style="margin:8px 0"><summary style="font-weight:700;cursor:pointer">💰 Pagos de la oficina (${(e.pagos||[]).length})</summary><div class="r" style="margin-top:6px;flex-wrap:nowrap"><input id="evp_m_${e.id}" type="number" placeholder="Monto $" style="width:120px"><input id="evp_n_${e.id}" placeholder="Nota (ej. transferencia BBVA)" style="flex:1;width:auto"><button onclick="evtPago('${e.id}')">💾 Registrar pago</button></div>
${(e.pagos||[]).map(p=>`<div class="mu">${new Date(p.creado).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})} · <b>$${r2(+p.monto)}</b>${p.nota?' · '+esc(p.nota):''}</div>`).join('')}</details>
<details class="c" style="margin:8px 0"><summary style="font-weight:700;cursor:pointer">📍 Coordinadores (${(e.coords||[]).length})</summary>${(e.coords||[]).map(c=>`<div class="mu" style="margin:4px 0"><b>${esc(c.nombre)}</b>${c.zona?' · '+esc(c.zona):''} · <a target="_blank" href="${evWa(c.cel,'📣 '+e.nombre+'\nHola '+c.nombre+', tu liga para pedir taxis: '+evLiga(c.tok,1))}">📤 su liga</a></div>`).join('')||'<div class="mu">La oficina los da de alta en su tablero.</div>'}</details>
<details class="c" style="margin:8px 0"><summary style="font-weight:700;cursor:pointer">🚕 Pagar a taxistas (${(e.liquidar||[]).length})</summary><div class="mu">Servicios terminados del evento. La comisión ya se les descontó de su saldo como siempre.</div>${(e.liquidar||[]).map(x=>`<div style="margin:4px 0">🚕 <b>${esc(x.taxi||'')}</b> ${esc(x.nombre||'')} · ${x.n} servicio(s) · 👥 ${x.personas} · <b>$${r2(+x.total)}</b></div>`).join('')}</details>
${(e.fotos||[]).length?`<details class="c" style="margin:8px 0" ontoggle="if(this.open)evtFotos('${e.id}')"><summary style="font-weight:700;cursor:pointer">📷 Fotos de INE (${e.fotos.length} servicio(s))</summary><div class="mu">Datos personales: solo tú las ves. Bórralas cuando ya no se necesiten.</div><div id="evf_${e.id}"></div></details>`:''}
<button class="s" style="margin-top:6px" onclick="evtActivo('${e.id}',${!e.activo})">${e.activo?'🔒 Cerrar evento (las ligas dejan de funcionar)':'🔓 Reabrir evento'}</button></div>`}
async function evtNuevo(){const n=$('evn').value.trim();if(n.length<3)return toast('Ponle nombre al evento');const r=await sb.rpc('ev_guardar',{p:{nombre:n}});if(r.error||!r.data||!r.data.ok)return toast('Error: '+(r.error?(/function|does not exist/i.test(r.error.message)?'falta correr el paso 36':r.error.message):(r.data.msg||'')));toast('✅ Evento creado. Mándale la liga de la central a la oficina.');cargarEvt()}
async function evtPago(id){const m=+$('evp_m_'+id).value;if(!m)return toast('Pon el monto');const r=await sb.rpc('ev_pago',{p_ev:id,p_monto:m,p_nota:$('evp_n_'+id).value});if(r.error||!r.data||!r.data.ok)return toast('Error');toast('✅ Pago registrado: ya tienen más crédito');cargarEvt()}
async function evtActivo(id,a){if(!a&&!confirm('¿Cerrar el evento? La central y los coordinadores ya no podrán pedir.'))return;await sb.rpc('ev_guardar',{p:{id,activo:a}});cargarEvt()}
async function evtFotos(id){const e=(S.EVT||[]).find(x=>x.id==id),b=$('evf_'+id);if(!e||!b)return;b.innerHTML='Cargando…';let h='';
for(const f of e.fotos){for(const p of (f.f||[])){try{const r=await sb.storage.from('eventos').createSignedUrl(p,600);if(r.data)h+=`<a target="_blank" href="${esc(r.data.signedUrl)}"><img src="${esc(r.data.signedUrl)}" alt="INE" style="width:110px;height:80px;object-fit:cover;border-radius:8px;margin:3px"></a>`}catch(x){}}h+=`<div class="mu">🚕 ${esc(f.taxi||'')}</div>`}b.innerHTML=h||'Sin fotos'}

/* ----- taxista: etiqueta del evento, personas a bordo y foto de INE ----- */
const evTag=s=>s&&s.evento_id?`<span class="t" style="background:#0d2c54;color:#fff;font-weight:800">${esc(s.ev_txt||'📣 EVENTO')} · YA PAGADO</span><button class="s" style="padding:3px 8px;font-size:13px" onclick="event.stopPropagation();evFotosSrv('${s.id}')">📷 Fotos del punto</button>${s.tomado_por==(S.me&&S.me.id)&&['llego','abordo','terminado'].includes(s.estado)?`<button class="s" style="padding:3px 8px;font-size:13px" onclick="event.stopPropagation();evAbordo('${s.id}')">👥 ${s.ev_personas!=null?s.ev_personas+' a bordo':'¿Cuántos van?'}${(s.ev_fotos||[]).length?' · 📷'+s.ev_fotos.length:''}</button>`:''}`:'';
function evAbordo(id){const s=byId(id)||(S.MJ||[]).find(x=>x.id==id)||{id};document.querySelectorAll('#evabv').forEach(x=>x.remove());const d=document.createElement('div');d.className='fotov';d.id='evabv';
d.innerHTML=`<div class="c" style="max-width:440px;width:100%;text-align:center"><div style="font-size:20px;font-weight:900">👥 ¿Cuántas personas subieron?</div><div class="mu">Un niño cuenta como una persona.</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0">${[1,2,3,4,5,6].map(n=>`<button style="font-size:24px;padding:14px 0${s.ev_personas==n?';outline:4px solid #27ae60':''}" onclick="evAbG('${id}',${n})">${n}</button>`).join('')}</div>
<label style="text-align:left">📷 Foto de INE (solo si la piden)</label><label class="b s" style="display:block;cursor:pointer;margin-top:4px">📷 Tomar foto${(s.ev_fotos||[]).length?' ('+s.ev_fotos.length+' tomadas)':''}<input type="file" accept="image/*" capture="environment" hidden onchange="evFoto('${id}',this)"></label>
<div class="mu" style="margin-top:4px">La foto solo la ve el administrador de Taxicel.</div><button class="s" style="width:100%;margin-top:10px" onclick="this.closest('.fotov').remove()">Cerrar</button></div>`;document.body.appendChild(d)}
async function evAbG(id,n){const r=await sb.rpc('ev_abordo',{p_id:id,p_personas:n});if(r.error||r.data!='ok')return toast('No se pudo guardar');const s=byId(id);if(s)s.ev_personas=n;const m=(S.MJ||[]).find(x=>x.id==id);if(m)m.ev_personas=n;toast('✅ '+n+' persona(s) a bordo');document.querySelectorAll('#evabv').forEach(x=>x.remove());if(S.tab=='manejo')vManejo();else if(S.tab=='serv')vServ()}
async function evFoto(id,inp){const f=inp.files&&inp.files[0];if(!f)return;toast('📤 Subiendo foto…');try{const s=byId(id)||(S.MJ||[]).find(x=>x.id==id)||{};const b=await achica(f),p=S.me.grupo_id+'/'+(s.evento_id||'ev')+'/'+id+'/'+Date.now()+'.jpg';
const up=await sb.storage.from('eventos').upload(p,b,{contentType:'image/jpeg'});if(up.error)throw up.error;const r=await sb.rpc('ev_abordo',{p_id:id,p_personas:null,p_foto:p});if(r.error||r.data!='ok')throw new Error('no se guardó');
s.ev_fotos=(s.ev_fotos||[]).concat(p);toast('✅ Foto guardada');evAbordo(id)}catch(e){toast('No se pudo subir: '+String(e.message||e).slice(0,60))}}
// Al terminar un servicio del evento: no se cobra y se ofrece el siguiente más cercano
function evTermina(s){const d=document.createElement('div');d.className='fotov';const me=S.MIPOS,dl=llDe(s.destino_maps)||me;
const L=(S.L||[]).filter(x=>x.evento_id&&x.estado=='disponible').map(x=>{const o=llDe(x.ubic_maps);return {x,km:o&&dl?Math.hypot((o.lat-dl.lat)*111,(o.lng-dl.lng)*111*Math.cos(dl.lat*Math.PI/180)):null}}).sort((a,b)=>(a.km??99)-(b.km??99)).slice(0,4);
d.innerHTML=`<div class="c" style="max-width:440px;width:100%;text-align:center"><div style="font-size:20px;font-weight:800">✅ Servicio del evento terminado</div><div style="font-size:22px;font-weight:900;color:#0d2c54;margin:8px 0">💳 YA ESTÁ PAGADO<br><span style="font-size:16px">No le cobres al pasajero</span></div><div class="mu">Taxicel te paga $${r2(+s.costo||0)} de este servicio.</div>
${L.length?`<div style="font-weight:800;margin-top:12px;text-align:left">📣 Siguen esperando taxi:</div>${L.map(o=>`<div class="evu" style="text-align:left;border-color:#c0392b"><b>${esc(zona(o.x.ubic))} → ${esc(zona(o.x.destino))}</b><div class="mu">${esc(o.x.ev_txt||'')}${o.km!=null?' · a '+o.km.toFixed(1)+' km':''} · $${r2(+o.x.costo||0)}</div><button style="width:100%;margin-top:4px" onclick="this.closest('.fotov').remove();tomar('${o.x.id}')">✋ Lo tomo</button></div>`).join('')}`:'<div class="mu" style="margin-top:10px">Por ahora no hay más unidades pedidas en el evento.</div>'}
<button class="s" style="width:100%;margin-top:12px" onclick="this.closest('.fotov').remove()">Listo</button></div>`;document.body.appendChild(d)}


/* ---------- 🤳 mi foto y mis números ---------- */
const fotoURL=p=>p?U+'/storage/v1/object/public/perfil/'+p:'';
function miPerfil(){const st=S.MST;if(st===undefined){S.MST=null;sb.rpc('taxi_stats',{p_uid:S.me.id}).then(r=>{S.MST=r.error?false:r.data;if(S.tab=='doc')vDoc()})}
return `<div class="c" style="border:2px solid var(--mo2)"><div class="r" style="align-items:center;flex-wrap:nowrap;gap:12px">${S.me.foto?`<img src="${esc(fotoURL(S.me.foto))}" alt="Mi foto" style="width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--ac)">`:'<div style="width:76px;height:76px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:34px">🙂</div>'}
<div style="flex:1"><b>${esc(S.me.nombre)}</b>${ay('Tu foto es opcional. Si la subes, el cliente la ve cuando le llegas, y le da más confianza. También ves cuántos servicios llevas y tu calificación.')}${st?`<div>🚕 <b>${st.n}</b> servicios terminados</div><div>${st.prom!=null?'⭐ <b>'+st.prom+'</b> de 5 ('+st.votos+' calificaciones)':'⭐ Todavía sin calificaciones'}</div>`:''}

async function subirSelfie(inp){const f=inp.files&&inp.files[0];if(!f)return;toast('📤 Subiendo tu foto…');try{const b=await achica(f),p=S.me.id+'/'+Date.now()+'.jpg';const up=await sb.storage.from('perfil').upload(p,b,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
const r=await sb.rpc('mi_foto',{p_path:p});if(r.error||r.data!='ok')throw new Error(r.error?r.error.message:'no se guardó');S.me.foto=p;toast('✅ Foto guardada');vDoc()}catch(e){toast('No se pudo: '+(/bucket|not found|function/i.test(String(e.message||e))?'falta correr el paso 41':String(e.message||e).slice(0,60)))}}
const hrT=x=>x?new Date(x).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'}):'';
/* ---------- 🚕 carritos de colores ---------- */
const CARCOL=[['#7d3cb5','Morado'],['#4a1f73','Morado oscuro'],['#a8b0b8','Plateado'],['#1a1a1a','Negro'],['#f4f4ef','Blanco perla'],['#d4a017','Dorado'],['#c9a96e','Champaña'],['#7b1e3a','Vino'],['#c0261b','Rojo'],['#1c2f5e','Azul marino'],['#1c6fd1','Azul'],['#138d90','Turquesa'],['#0a7a3c','Verde'],['#e67e22','Naranja'],['#d6589c','Rosa']];
const carNom=c=>(CARCOL.find(x=>x[0]==c)||[0,'Personalizado'])[1];
function tono(h,p){h=String(h||'#7d3cb5').replace('#','');if(h.length==3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p/100):v+(255-v)*p/100)));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
let _cid=0;
function carSVG(c,w){c=c||'#7d3cb5';const k='cg'+(++_cid),o=tono(c,-38),m=tono(c,-12),l=tono(c,28),cl=/^#f/i.test(c)?'#777':'rgba(255,255,255,.35)';
return `<svg width="${w}" height="${Math.round(w*1.9)}" viewBox="0 0 40 76" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible"><defs><linearGradient id="${k}" x1="0" x2="1"><stop offset="0" stop-color="${o}"/><stop offset=".22" stop-color="${m}"/><stop offset=".5" stop-color="${l}"/><stop offset=".78" stop-color="${m}"/><stop offset="1" stop-color="${o}"/></linearGradient></defs>
<ellipse cx="21" cy="40" rx="17" ry="36" fill="rgba(0,0,0,.28)"/><rect x="1" y="24" width="6" height="4" rx="2" fill="${o}"/><rect x="33" y="24" width="6" height="4" rx="2" fill="${o}"/>
<path d="M20 2C30 2 35 6 35.5 14L36 60C36 69 31 74 20 74S4 69 4 60L4.5 14C5 6 10 2 20 2Z" fill="url(#${k})" stroke="${o}" stroke-width="1"/>
<path d="M12 6Q20 3 28 6" stroke="${cl}" stroke-width="1.2" fill="none"/><path d="M14 10L14 19M26 10L26 19" stroke="${cl}" stroke-width=".8"/>
<path d="M8.5 21Q20 16 31.5 21L29 31Q20 29 11 31Z" fill="#17212c"/><path d="M11 22.5Q20 19 29 22.5" stroke="rgba(160,200,255,.45)" stroke-width="1.4" fill="none"/>
<rect x="10.5" y="31" width="19" height="21" rx="3.5" fill="${l}" stroke="${o}" stroke-width=".6"/><rect x="15" y="38.5" width="10" height="5" rx="1.5" fill="#fff8d6" stroke="${o}" stroke-width=".5"/>
<path d="M11 52Q20 54 29 52L30.5 59Q20 62 9.5 59Z" fill="#17212c"/><path d="M6 33L6 50M34 33L34 50" stroke="#17212c" stroke-width="2.4" stroke-linecap="round"/>
<ellipse cx="10.5" cy="5.5" rx="3.4" ry="1.8" fill="#fffbe0"/><ellipse cx="29.5" cy="5.5" rx="3.4" ry="1.8" fill="#fffbe0"/><rect x="6.5" y="70" width="7" height="2.6" rx="1.2" fill="#e53935"/><rect x="26.5" y="70" width="7" height="2.6" rx="1.2" fill="#e53935"/></svg>`}
/* Marcador: carrito girado hacia donde va + número de taxi */
function carMk(c,txt,o){o=o||{};const w=o.w||20,d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;align-items:center;cursor:pointer;transform:translateY(50%)';
d.innerHTML=`<div class="carr" style="width:${Math.round(w*2.1)}px;height:${Math.round(w*2.1)}px;display:flex;align-items:center;justify-content:center;transition:transform .9s;transform:rotate(${o.rot||0}deg);opacity:${o.op||1}">${carSVG(c,w)}</div>${txt?`<div style="margin-top:-2px;background:#fff;color:#1d1d1b;border:2px solid ${c};border-radius:10px;padding:0 6px;font-size:12px;font-weight:900;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);opacity:${o.op||1}">${o.dot||''}${esc(txt)}</div>`:''}`;return d}
function rumbo(a,b){const r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return (Math.atan2(y,x)/r+360)%360}
const kmE=(a,b)=>{const r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r,h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*6371*Math.asin(Math.sqrt(h))};
function carGira(el,a,b){if(!el||!a||!b||kmE(a,b)<0.012)return;const c=el.querySelector('.carr');if(c)c.style.transform='rotate('+Math.round(rumbo(a,b))+'deg)'}
/* Selector de color de carrito (para el admin) */
function carPicker(cur,fn,usados){return `<div class="r" style="gap:6px;margin:4px 0">${CARCOL.map(([c,n])=>{const u=(usados||{})[c];return `<button type="button" title="${n}${u?' · ya lo usa '+esc(u):''}" onclick="${fn}('${c}')" style="width:54px;min-width:54px;height:72px;padding:3px 0 0;border-radius:10px;background:#f5f5f5!important;color:#1d1d1b!important;border:${cur==c?'4px solid #f2b705':'2px solid #bbb'}!important;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;line-height:1.05;position:relative">${carSVG(c,13)}<span>${n}</span>${u&&cur!=c?'<span style="position:absolute;top:1px;right:3px;font-size:10px">•</span>':''}</button>`}).join('')}</div>`}
function carUsados(){const u={},a=(c,n)=>{if(c)u[c]=u[c]?u[c]+', '+n:n};a((S.g||{}).carro_color||'#7d3cb5',(S.g||{}).nombre||'Taxicel');(S.EQS||[]).forEach(e=>a(e.carro_color||'#7d3cb5',e.nombre));return u}
function carPanel(){const g=S.g||{},cur=g.carro_color||'#7d3cb5';return `<div class="c" style="margin:8px 0;border:2px solid ${cur}"><b>🚕 Carrito de ${esc(g.nombre||'Taxicel')} en el mapa</b>${ay('Así se ven en el mapa los taxis que <b>no son de ningún equipo</b>. Cada equipo elige el suyo abajo en su tarjeta. El puntito • quiere decir que ese color ya lo usa otro.')}
<div class="r" style="align-items:center;gap:10px;margin:4px 0">${carSVG(cur,22)}<span>Ahorita: <b>${carNom(cur)}</b></span></div><details><summary style="cursor:pointer;font-weight:700">Cambiar color</summary>${carPicker(cur,'gCarro',carUsados())}</details></div>`}
async function gCarro(c){const {error}=await sb.from('grupos').update({carro_color:c}).eq('id',S.g.id);if(error)return toast('No se pudo: '+(/carro_color/.test(error.message)?'falta correr el paso 43':error.message));S.g.carro_color=c;vEq();toast('🚕 Listo: '+carNom(c))}
async function eqCarro(id,c){const {error}=await sb.from('equipos').update({carro_color:c}).eq('id',id);if(error)return toast('No se pudo: '+(/carro_color/.test(error.message)?'falta correr el paso 43':error.message));await cargarEQ();vEq();toast('🚕 Listo: '+carNom(c))}

// agrupa por dirección (como rebanadas de pastel alrededor de la empresa) para que vayan juntos los que viven del mismo lado
function repGrupos(B,L,cap,k){const a=L.map(o=>({o,ang:Math.atan2(o.ll.lat-B.lat,(o.ll.lng-B.lng)*Math.cos(B.lat*Math.PI/180))})).sort((x,y)=>x.ang-y.ang);
if(a.length>1){let gi=0,gm=-1;for(let i=0;i<a.length;i++){const d=((a[(i+1)%a.length].ang-a[i].ang)+2*Math.PI)%(2*Math.PI);if(d>gm){gm=d;gi=i}}const s=(gi+1)%a.length;a.push(...a.splice(0,s))}
k=Math.max(Math.ceil(a.length/cap),Math.min(a.length,k||0));const G=[];let i=0;for(let g=0;g<k;g++){const t=Math.ceil((a.length-i)/(k-g));G.push(a.slice(i,i+t).map(x=>x.o));i+=t}return G}
const repPt=ll=>({location:{latLng:{latitude:ll.lat,longitude:ll.lng}}});
async function repRuta(o,d,mid){const b={origin:repPt(o),destination:repPt(d),travelMode:'DRIVE',languageCode:'es-MX',regionCode:'MX'};if(mid&&mid.length){b.intermediates=mid.map(repPt);b.optimizeWaypointOrder=true}
const r=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':GKEY,'X-Goog-FieldMask':'routes.distanceMeters,routes.duration,routes.optimizedIntermediateWaypointIndex'},body:JSON.stringify(b)});
const j=await r.json(),rt=j.routes&&j.routes[0];if(!rt||!rt.distanceMeters)throw new Error((j.error&&j.error.message)||'No encontré la ruta');return {k:Math.round(rt.distanceMeters/100)/10,min:Math.round(parseInt(rt.duration)/60),ord:rt.optimizedIntermediateWaypointIndex||[]}}
const repFo=ll=>fueraCd('https://maps.google.com/?q='+ll.lat+','+ll.lng);
async function repCalc(B,grupos,ind,sal){const T=[];for(const g of grupos){if(!g.length)continue;const lej=g.reduce((m,o)=>ind[o.i].k>ind[m.i].k?o:m,g[0]),resto=g.filter(o=>o!==lej);
const x=sal?await repRuta(B,lej.ll,resto.map(o=>o.ll)):await repRuta(lej.ll,B,resto.map(o=>o.ll));const ordR=x.ord.length?x.ord.map(j=>resto[j]):resto,orden=sal?ordR.concat([lej]):[lej].concat(ordR);
const sug=tarifa(x.k,false,orden.some(o=>repFo(o.ll))),indiv=orden.reduce((a,o)=>a+tarifa(ind[o.i].k,false,repFo(o.ll)),0);
T.push({ids:orden.map(o=>o.i),k:x.k,min:x.min,sug,indiv,acord:sug,lejk:ind[lej.i].k,ik:Object.fromEntries(orden.map(o=>[o.i,ind[o.i].k]))})}return T}
const repSum=T=>({tot:T.reduce((a,t)=>a+t.sug,0),maxm:Math.max(0,...T.map(t=>t.min)),km:Math.round(T.reduce((a,t)=>a+t.k,0)*10)/10});
async function repArmar(G){preLee();repLee();const R=repR(),B=llMaps(R.bm);if(!B)return toast('Elige de la lista la dirección de la empresa');
const L=R.pers.map((p,i)=>({i,p,ll:repLL(p)}));if(L.some(o=>!o.ll))return toast('Falta elegir de la lista la dirección de: '+L.filter(o=>!o.ll).map(o=>o.p.n||'persona '+(o.i+1)).join(', '));
$('rp_res').innerHTML='<div class="mu" style="margin-top:8px">🧮 Calculando rutas… (comparo varias formas de acomodarlos)</div>';const sal=R.dir=='salida';
try{const key=R.dir+'|'+R.bm+'|'+R.pers.map(p=>p.m).join('|');if(!R.ind||R.indK!=key){const ind={};for(const o of L){ind[o.i]=sal?await repRuta(B,o.ll):await repRuta(o.ll,B)}R.ind=ind;R.indK=key}const ind=R.ind;
if(G){R.tx=await repCalc(B,G,ind,sal);R.opSel=null;render();return}
const kmin=Math.ceil(L.length/R.cap),kmax=Math.min(L.length,kmin+2),ops=[];
for(let k=kmin;k<=kmax;k++){const T=await repCalc(B,repGrupos(B,L,R.cap,k),ind,sal);ops.push(Object.assign({k,T},repSum(T)))}
const lim=+R.tmax||0,ok=ops.filter(o=>!lim||o.maxm<=lim),best=(ok.length?ok.slice().sort((a,b)=>a.tot-b.tot||a.k-b.k):ops.slice().sort((a,b)=>a.maxm-b.maxm))[0];
R.ops=ops.map(o=>({k:o.k,tot:o.tot,maxm:o.maxm,km:o.km,T:o.T}));R.rec=best.k;R.opSel=best.k;R.tx=JSON.parse(JSON.stringify(best.T));render()}
catch(e){$('rp_res').innerHTML='<div style="color:#c0392b;margin-top:8px">⚠️ '+esc(String(e.message||e).slice(0,100))+'</div>'}}
function repUsar(k){preLee();repLee();const R=repR(),o=(R.ops||[]).find(x=>x.k==k);if(!o)return;R.tx=JSON.parse(JSON.stringify(o.T));R.opSel=k;render()}

return `<div style="border:3px solid ${c};border-radius:12px;padding:8px;margin:8px 0"><div class="r" style="justify-content:space-between;align-items:center"><b style="color:${c};font-size:17px">🚕 Taxi ${ti+1} · ${t.ids.length} persona(s)</b><span class="mu">📏 ${t.k} km · ⏱️ ${t.min} min${+R.tmax&&t.min>+R.tmax?' <b style="color:#c0392b">(más de '+R.tmax+')</b>':''}</span></div>
<div style="margin:4px 0">${sal?'🏢 Empresa → ':''}${t.ids.map((i,n)=>`<div style="display:flex;align-items:center;gap:6px;margin:3px 0"><b>${n+1}.</b> <span style="flex:1">${esc(P[i].n||'Persona '+(i+1))} <span class="mu">· ${esc(zona(P[i].t))} · solo: ${t.ik[i]} km</span></span>${nT>1||R.tx.length<R.pers.length?`<select style="width:auto;padding:4px" onchange="repMover(${i},+this.value)">${R.tx.map((_,k)=>`<option value="${k}"${k==ti?' selected':''}>Taxi ${k+1}</option>`).join('')}<option value="${nT}">➕ Taxi nuevo</option></select>`:''}</div>`).join('')}${sal?'':'→ 🏢 Empresa'}</div>
${des>=60?`<div style="background:#fff3e0;color:#1d1d1b;border:2px solid #e65100;border-radius:8px;padding:6px;margin:4px 0">⚠️ Esta ruta da mucha vuelta: ${des}% más km que llevar solo al que vive más lejos. Prueba mover a alguien a otro taxi.</div>`:''}
<div class="g" style="margin-top:4px"><div><div class="mu">💰 Precio sugerido (compartido)</div><b style="font-size:20px">$${r2(t.sug)}</b><div class="mu">Cada uno solo: $${r2(t.indiv)}</div></div><div><label style="margin:0">🤝 Precio acordado</label><input type="number" min="0" value="${+t.acord}" oninput="S.PR.rep.tx[${ti}].acord=+this.value||0;$('rp_tot').innerHTML=repTotH()"></div></div></div>`}).join('')}

function hTx(el,fin){const d=el.value.replace(/\D/g,'').slice(0,4),H=$(el.dataset.h),M=$(el.dataset.m);let h=0,m=0,ok=1;

if(h>23||m>59)ok=0;else if(h>12){hAP(el.id,'PM',1);h-=12}else if(h==0){hAP(el.id,'AM',1);h=12}else if(!el.dataset.man&&d.length>=3){const f=$('fecha'),hoy=!f||!f.value||f.value==iso(new Date()),n=new Date(),am=(h%12)*60+m;if(hoy)hAP(el.id,am<n.getHours()*60+n.getMinutes()?'PM':'AM',1)}}
el.style.borderColor=ok?'':'var(--rd)';const mm=String(m).padStart(2,'0');
H.value=ok&&d?String(h):'';M.value=ok&&d?mm:'00';if(fin&&ok&&d)el.value=h+':'+mm;

${C.n?`<div class="r">${T.map(x=>`<button class="${C.tags.includes(x)?'':'s'}" onclick="calTag('${x}','${t}')">${x}</button>`).join('')}</div><label>${C.n<=2?'¿Qué pasó? Cuéntenos (opcional)':'Comentario (opcional)'}</label><textarea id="cal_c" rows="3" maxlength="500">${esc(C.c||'')}</textarea><button style="width:100%;margin-top:8px;font-size:18px" onclick="calEnviar('${t}')">Enviar calificación</button>`:'<div class="mu">Toque las estrellas</div>'}</div>`};

<script>/* ===== HANAL PIXÁN: 31 oct (niños), 1 nov (adultos), 2 nov (todos los fieles difuntos). Se quita solo el 3 de noviembre. Probar: ?hanal=31 / 1 / 2 ===== */

let k=q?+q:(mo==9&&dd==31?31:mo==10&&(dd==1||dd==2)?dd:0);if(k!=31&&k!=1&&k!=2)return;

const xte=s=>`<svg width="${s*.8}" height="${s}" viewBox="0 0 16 20"><path d="M8 1C5 4 2 6 3 10c-2 2-1 6 2 7h6c3-1 4-5 2-7 1-4-2-6-5-9z" fill="#c4162a"/><path d="M8 5c-2 2-3 4-2 7M8 5c2 2 3 4 2 7" stroke="#8a0d1c" stroke-width=".8" fill="none"/><rect x="7.3" y="17" width="1.4" height="3" fill="#2e7d32"/></svg>`;
const vela=c=>`<span class="hpv"><i></i><b style="background:${c}"></b></span>`;
const colN=['#ff4fa3','#7b3fe4','#1fb5d6','#2fbf4a','#ff8a00'];
const st=document.createElement('style');st.textContent=`

if(!vis||q){const m=document.createElement('div');m.id='hpm';m.innerHTML=`🕯️ <b>${TX[0]}</b> 🌼<small>${TX[1]}${nino?' · que los pequeños encuentren su camino':' · recordamos con cariño a los que se adelantaron'}</small><button>Gracias</button>`;

}catch(e){}})();</script></body></html>
