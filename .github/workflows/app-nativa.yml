name: App nativa Android
on:
  push:
    branches: [main]
    paths: ['app-nativa/**', '.github/workflows/app-nativa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-nativa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Permisos de ubicación en segundo plano
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' $M
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_channel_name">Ubicación del servicio</string>\n</resources>#' $S
          grep -c BACKGROUND_LOCATION $M
      - run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: app-nativa/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nativa-${{ github.run_number }}
          name: TaxiCentral nativa (prueba ${{ github.run_number }})
          body: APK de prueba (sin firma de Play Store). Se instala en Android aparte de la app actual.
          files: app-nativa/android/app/build/outputs/apk/debug/app-debug.apk
